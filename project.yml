name: DSHConnect
options:
  bundleIdPrefix: com.dshconnect
  deploymentTarget:
    iOS: "26.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.3
targets:
  DSHConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources/DSHConnect
    resources:
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dshconnect.app
      INFOPLIST_FILE: Sources/DSHConnect/Info.plist
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: Yams
